<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <title>Figma & Vue 3 Component Builder Workspace</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">

    <style>
        :root {
            --bg-main: #1E1E1E;
            --bg-panel: #252526;
            --bg-input: #2D2D2D;
            --border-color: #3C3C3C;
            --text-main: #CCCCCC;
            --text-bright: #FFFFFF;
            --brand-blue: #007ACC;
            --brand-prime: #5cd5fb;
            --brand-green: #4EC9B0;
            --brand-orange: #CE9178;
            --brand-red: #F44336;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--bg-panel);
            padding: 10px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 16px;
            color: var(--text-bright);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-badge {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            background-color: #333;
            border: 1px solid #555;
        }

        .workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .panel-left {
            width: 35%;
            border-right: 1px solid var(--border-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background-color: var(--bg-panel);
            overflow-y: auto;
        }

        .panel-right {
            width: 65%;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-main);
        }

        label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #858585;
        }

        textarea {
            width: 100%;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-bright);
            padding: 10px;
            box-sizing: border-box;
            font-family: "Fira Code", Consolas, monospace;
            font-size: 13px;
        }

        #prompt {
            height: 100px;
            font-family: sans-serif;
            resize: none;
            border: 1px solid #444;
        }

        #prompt:focus {
            border-color: var(--brand-blue);
            outline: none;
        }

        .btn {
            background-color: var(--brand-blue);
            color: var(--text-bright);
            border: none;
            border-radius: 4px;
            padding: 12px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            background-color: #1A8CD8;
        }

        .btn:disabled {
            background-color: #444 !important;
            color: #888 !important;
            cursor: not-allowed;
            border: 1px solid #555;
        }

        /* Лог истории */
        .history-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
            margin-top: 10px;
        }

        .history-log {
            flex: 1;
            background-color: #1A1A1A;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 10px;
            font-family: monospace;
            font-size: 11px;
            overflow-y: auto;
            color: #A9B7C6;
            line-height: 1.4;
        }

        .log-entry {
            margin-bottom: 6px;
            border-bottom: 1px dashed #2D2D2D;
            padding-bottom: 4px;
        }

        .log-time {
            color: #6A9955;
        }

        .log-prompt {
            color: #CE9178;
            font-style: italic;
        }

        .log-status-working {
            color: #64B5F6;
        }

        .log-status-success {
            color: #81C784;
            font-weight: bold;
        }

        .log-status-error {
            color: #E57373;
            font-weight: bold;
        }

        /* Новые изолированные стили для кнопок контекста */
        .ctx-tabs-container {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .ctx-btn-group {
            display: flex;
            gap: 6px;
            margin-bottom: 5px;
        }

        .ctx-btn {
            background-color: var(--bg-input);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 6px 12px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            flex: 1;
            text-align: center;
        }

        .ctx-btn:hover {
            background-color: #383838;
            color: var(--text-bright);
            border-color: var(--brand-prime);
        }

        /* Стиль для активной кнопки режима */
        .ctx-btn.mode-active {
            background-color: #2D3748 !important;
            border-color: var(--brand-blue) !important;
            color: var(--text-bright) !important;
            box-shadow: 0 0 4px rgba(0, 122, 204, 0.4);
        }

        /* Tabs */
        .tabs-header {
            display: flex;
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border-color);
            padding: 0 10px;
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 12px 20px;
            color: #858585;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }

        .tab-btn.active {
            color: var(--text-bright);
            border-bottom: 2px solid var(--brand-blue);
        }

        .tabs-content {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .tab-pane {
            display: none;
            height: 100%;
            width: 100%;
        }

        .tab-pane.active {
            display: block;
        }

        .code-container {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            position: relative;
            background: #1D1F21;
        }

        .code-scroll-wrapper {
            height: 100%;
            overflow: auto;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }

        pre {
            background-color: #1d1f21;
            /* Темный фон под тему Tomorrow Night */
            border-radius: 8px;
            /* Скругление углов */
            padding: 1.5rem;
            /* Внутренние отступы */
            overflow-x: auto;
            /* Горизонтальный скролл, если код не помещается */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 1px solid #2d3139;
            /* Тонкая рамка */
        }

        pre[class*="language-"] {
            margin: 0 !important;
            padding: 0 !important;
            background: transparent !important;
        }

        /* Красивый скроллбар для длинного кода */
        pre::-webkit-scrollbar {
            height: 8px;
        }

        pre::-webkit-scrollbar-track {
            background: #1d1f21;
        }

        pre::-webkit-scrollbar-thumb {
            background: #3e4451;
            border-radius: 4px;
        }

        code[class*="language-"] {
            /* Программистский шрифт */
            line-height: 1.5;
            tab-size: 2;
            /* Размер табуляции */
            font-family: 'Fira Code', 'Courier New', Courier, Consolas, monospace !important;
            font-size: 0.9rem !important;
        }

        #json-output {
            font-size: 11px;
            background-color: #1E1E1E;
        }

        .code-area {
            height: 100%;
            width: 100%;
            border: none;
            border-radius: 0;
            background-color: var(--bg-main);
            padding: 20px;
            font-size: 12px;
            line-height: 1.5;
            overflow-y: auto;
        }

        .copy-btn {
            position: absolute;
            top: 15px;
            right: 25px;
            background-color: #333333;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 5px 10px;
            font-size: 11px;
            border-radius: 4px;
            cursor: pointer;
            z-index: 10;
        }

        .copy-btn:hover {
            background-color: #444;
            color: var(--text-bright);
        }
    </style>

    <!-- Tailwind CSS для стилизации -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Prism.js для красивой подсветки кода -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markup.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-typescript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js"></script>

    <!-- Clipboard.js для копирования -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/clipboard.js/2.0.11/clipboard.min.js"></script>

</head>

<body>

    <header>
        <h1>🤖 UI Component Generation Lab <span class="status-badge">Порт: 5555</span></h1>
        <div>v1.2 (Multi-Agent System)</div>
    </header>

    <div class="workspace">
        <!-- Левая панель: Управление, Статусы и История -->
        <div class="panel-left">
            <label for="prompt" style="margin-top: 10px;">Техническое задание</label>
            <textarea id="prompt"
                placeholder="Например: Кнопка (Button) со скруглением 8px, ярким синим фоном и текстом..."></textarea>

            <div class="ctx-tabs-container">
                <label>Дополнительный контекст (Опционально)</label>
                <div class="ctx-btn-group">
                    <button type="button" class="ctx-btn" id="mode-none-btn" onclick="setContextMode('none')">Без
                        контекста</button>
                    <button type="button" class="ctx-btn" id="mode-svg-btn" onclick="setContextMode('svg')">Вставить
                        SVG</button>
                    <button type="button" class="ctx-btn" id="mode-id-btn" onclick="setContextMode('id')">Вставить
                        Node ID</button>
                </div>

                <div id="context-inputs">
                    <textarea id="svg-ref" style="height: 70px; font-size: 11px; display: none;"
                        placeholder="Вставьте скопированный SVG (<svg>...</svg>)..."></textarea>
                    <input type="text" id="node-id-ref"
                        style="width: 100%; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: 4px; color: var(--text-bright); padding: 10px; box-sizing: border-box; font-family: monospace; font-size: 12px; display: none;"
                        placeholder="Ссылка на комонент либо его id">
                </div>
            </div>

            <div id="progress-container"
                class="w-full bg-[#1a1a1a] border border-[#2d2d2d] rounded-lg p-3 space-y-2 mb-3">
                <div class="flex justify-between text-xs font-mono text-gray-400">
                    <span id="progress-status" class="w-[90%]">Конвейер остановлен</span>
                    <span id="progress-ratio">0%</span>
                </div>
                <div class="w-full bg-[#2d2d2d] rounded-full h-2 overflow-hidden">
                    <div id="progress-bar" class="bg-[#007acc] h-full transition-all duration-300" style="width: 0%">
                    </div>
                </div>
            </div>

            <button id="generate-btn" class="btn">Запустить конвейер генерации</button>

            <!-- Секция истории логов -->
            <div class="history-section">
                <label>Журнал событий и история ТЗ</label>
                <div id="history-log" class="history-log">
                    <div style="color: #555;">// Журнал пуст. Ожидание запуска...</div>
                </div>
            </div>


            <!-- <div id="context-inputs">
                <textarea id="svg-ref" style="height: 60px; font-size: 11px; display: none;"
                    placeholder="Вставьте скопированный SVG (<svg>...</svg>)..."></textarea>
                <input type="text" id="node-id-ref"
                    style="width: 100%; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: 4px; color: var(--text-bright); padding: 8px; box-sizing: border-box; font-family: monospace; display: none;"
                    placeholder="Ссылка на комонент либо его id">
            </div> -->
        </div>

        <!-- Правая панель: Результаты работы ИИ -->
        <div class="panel-right">
            <div class="tabs-header">
                <button class="tab-btn active" onclick="switchTab('vue-pane', this)">Vue Component (.vue)</button>
                <button class="tab-btn" onclick="switchTab('figma-pane', this)">Figma Nodes (JSON)</button>
            </div>

            <div class="tabs-content">
                <div id="vue-pane" class="tab-pane active">
                    <div class="code-container">
                        <button class="copy-btn " id="vue-copy-btn"
                            data-clipboard-target="#vue-output-code">Копировать</button>
                        <div class="code-scroll-wrapper">
                            <pre><code id="vue-output-code" class="language-markup" >// Здесь появится готовый код Vue 3...</code></pre>
                        </div>
                    </div>
                </div>

                <div id="figma-pane" class="tab-pane">
                    <div class="code-container">
                        <button class="copy-btn" onclick="copyToClipboard('json-output')">Копировать</button>
                        <textarea id="json-output" class="code-area"
                            placeholder="{\n  // Здесь появится структура Figma JSON\n}" readonly></textarea>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const generateBtn = document.getElementById('generate-btn');
        const promptInput = document.getElementById('prompt');
        const vueOutput = document.getElementById('vue-output-code');
        const jsonOutput = document.getElementById('json-output');
        const historyLog = document.getElementById('history-log');

        let currentContextMode = 'none';

        function setContextMode(mode) {
            currentContextMode = mode;
            document.getElementById('svg-ref').style.display = mode === 'svg' ? 'block' : 'none';
            document.getElementById('node-id-ref').style.display = mode === 'id' ? 'block' : 'none';


            // Сбрасываем активные классы со всех кнопок режима
            document.getElementById('mode-none-btn').classList.remove('mode-active');
            document.getElementById('mode-svg-btn').classList.remove('mode-active');
            document.getElementById('mode-id-btn').classList.remove('mode-active');

            // Добавляем класс подсветки только выбранной кнопке
            if (mode === 'none') document.getElementById('mode-none-btn').classList.add('mode-active');
            if (mode === 'svg') document.getElementById('mode-svg-btn').classList.add('mode-active');
            if (mode === 'id') document.getElementById('mode-id-btn').classList.add('mode-active');
        }

        setContextMode('none');

        function switchTab(paneId, btn) {
            document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(paneId).classList.add('active');
            btn.classList.add('active');
        }

        function getTime() {
            return new Date().toLocaleTimeString();
        }

        function logToUI(htmlContent) {
            if (historyLog.innerHTML.includes('// Журнал пуст')) {
                historyLog.innerHTML = '';
            }
            historyLog.innerHTML += `<div class="log-entry">${htmlContent}</div>`;
            historyLog.scrollTop = historyLog.scrollHeight;
        }

        generateBtn.onclick = async () => {
    const promptText = promptInput.value.trim();
    let svgText = null;
    let nodeIdText = null;

    if (!promptText) return alert('Пожалуйста, введите ТЗ для генерации!');
    if (currentContextMode === 'svg') svgText = document.getElementById('svg-ref').value.trim() || null;
    if (currentContextMode === 'id') {
        nodeIdText = document.getElementById('node-id-ref').value.trim() || null;

        const match = nodeIdText.match(/(?:node-id=)?(\d+-\d+)/);
        const nodeId = match ? match[1] : null; 
        nodeIdText = nodeId
    }

    // Находим элементы нашего нового прогресс-бара
    const progressBar = document.getElementById('progress-bar');
    const progressRatio = document.getElementById('progress-ratio');
    const progressStatus = document.getElementById('progress-status');

    // Блокировка интерфейса
    generateBtn.disabled = true;
    promptInput.disabled = true;
    generateBtn.style.backgroundColor = '#d32f2f'; // Красный цвет блокировки
    generateBtn.innerText = '⏳ Подключение к ИИ-агентам...';

    // Стартовые заглушки в экраны вывода
    vueOutput.textContent = '// Агенты запущены.\n// Начинается потоковый расчет в WSL...';
    jsonOutput.value = '{\n  "status": "Ожидание проектирования слоев..."\n}';
    if (typeof Prism !== 'undefined') Prism.highlightElement(vueOutput);

    // Сброс шкалы прогресс-бара
    if (progressBar) progressBar.style.width = '0%';
    if (progressRatio) progressRatio.textContent = '0%';
    if (progressStatus) progressStatus.textContent = 'Инициализация пайплайна...';

    try {
        // Отправляем POST-запрос на стриминговый роут
        const response = await fetch('/api/generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                prompt: promptText,
                svg: svgText,
                node_id: nodeIdText
            })
        });

        if (!response.ok) {
            const errData = await response.json().catch(() => ({}));
            throw new Error(errData.error || `Код сервера ${response.status}`);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let buffer = "";

        while (true) {
            const { value, done } = await reader.read();
            if (done) break;

            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split("\n\n");
            buffer = lines.pop(); // Хвост оставляем в буфере

            for (const line of lines) {
                if (line.startsWith("data: ")) {
                    const eventData = JSON.parse(line.substring(6));

                    // 1. ПОЛУЧЕНИЕ ШАГОВ ПРОГРЕССА И ЛОГОВ ОТ БЭКЕНДА
                    if (eventData.type === 'progress') {
                        // Динамически обновляем прогресс-бар и текст кнопки
                        if (progressBar) progressBar.style.width = `${eventData.percent}%`;
                        if (progressRatio) progressRatio.textContent = `${eventData.percent}%`;
                        if (progressStatus) progressStatus.textContent = eventData.status;
                        
                        generateBtn.innerText = `⏳ [${eventData.percent}%] Обработка...`;

                        // Выводим красивую веху в ваш журнал логов
                        logToUI(`<div><span class="log-time">[${getTime()}]</span> <span class="log-status-working">⚙️</span> ${eventData.status}</div>`);

                    // 2. ОБРАБОТКА КРИТИЧЕСКОЙ ОШИБКИ ИИ
                    } else if (eventData.type === 'error') {
                        throw new Error(eventData.text);

                    // 3. ФИНАЛЬНЫЙ СБОР ПАКЕТА ДАННЫХ
                    } else if (eventData.type === 'done') {
                        const payload = eventData.result.nodes;

                        // Выводим отформатированное дерево Figma-нод в JSON окно
                        jsonOutput.value = JSON.stringify(payload.figma_nodes, null, 4);

                        // Чистим и стриппим markdown-теги ```vue из кода
                        let cleanVueCode = payload.vue_code || '';
                        cleanVueCode = cleanVueCode.replace(/^```vue\n?/i, '');
                        cleanVueCode = cleanVueCode.replace(/```\$/g, '');

                        // Выводим готовый компонент Vue 3
                        vueOutput.textContent = cleanVueCode || '// Код не сгенерирован';
                        
                        if (typeof Prism !== 'undefined') {
                            Prism.highlightElement(vueOutput);
                        }

                        logToUI(`<div><span class="log-time">[${getTime()}]</span> <span class="log-status-success">✅ Успех!</span> Комплект полностью собран и передан в UI.</div>`);
                    }
                }
            }
        }

    } catch (error) {
        vueOutput.textContent = `❌ Ошибка конвейера автоматизации.\n\nДетали: ${error.message}\nПроверьте консоль WSL терминала.`;
        jsonOutput.value = JSON.stringify({ "error": error.message }, null, 4);
        if (typeof Prism !== 'undefined') Prism.highlightElement(vueOutput);

        logToUI(`<div><span class="log-time">[${getTime()}]</span> <span class="log-status-error">💥 Ошибка:</span> ${error.message}</div>`);
        if (progressStatus) progressStatus.textContent = 'Конвейер аварийно остановлен';
    } finally {
        generateBtn.disabled = false;
        promptInput.disabled = false;
        generateBtn.style.backgroundColor = 'var(--brand-blue)';
        generateBtn.innerText = 'Запустить конвейер генерации';
    }
};

        const vueClipboard = new ClipboardJS('#vue-copy-btn', {
            text: function () {
                return document.getElementById('vue-output-code').textContent;
            }
        });

        vueClipboard.on('success', function (e) {
            const btn = e.trigger;
            const oldText = btn.innerText;
            btn.innerText = 'Скопировано! ✓';
            btn.style.backgroundColor = '#10B981';

            setTimeout(() => {
                btn.innerText = oldText;
                btn.style.backgroundColor = '#333333';
            }, 1500);

            e.clearSelection();
        });

        vueClipboard.on('error', function (e) {
            alert('Не удалось скопировать. Пожалуйста, выделите текст вручную.');
        });


        function copyToClipboard(elementId) {
            const area = document.getElementById(elementId);
            if (area.value.length < 50) return;
            area.select();
            document.execCommand('copy');

            const btn = area.previousElementSibling;
            const oldText = btn.innerText;
            btn.innerText = 'Скопировано! ✓';
            btn.style.backgroundColor = '#10B981';
            setTimeout(() => {
                btn.innerText = oldText;
                btn.style.backgroundColor = '#333333';
            }, 1500);
        }
    </script>
</body>

</html>
